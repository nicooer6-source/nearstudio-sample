<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#FFFFFF" />
<title>Wild Craft Pixel Field</title>
<style>
  @font-face{font-family:"Sneak";src:url("assets/fonts/Sneak-Light.woff") format("woff");font-weight:300;font-display:swap;}
  @font-face{font-family:"Sneak";src:url("assets/fonts/Sneak-Regular.woff2") format("woff2");font-weight:400;font-display:swap;}
  @font-face{font-family:"Sneak";src:url("assets/fonts/Sneak-Medium.woff2") format("woff2");font-weight:500;font-display:swap;}
  :root{
    --paper:#FFFFFF; --ink:#0A0A0A; --muted:#8b8b8b; --red:#e0492a; --neon:#d8ff00;
    --line:rgba(10,10,10,.12); --line-2:rgba(10,10,10,.06);
    --cell:14px; --gutter:56px; --maxw:1176px; --readw:34ch; --radius:26px;   /* spacing snapped to the 14px pixel grid */
    --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  }
  @media(max-width:680px){ :root{--gutter:28px;} }   /* 2 cells on mobile */
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth; overscroll-behavior:none;}
  body{margin:0; overscroll-behavior:none; background:var(--paper); color:var(--ink); overflow-x:hidden; font-family:"Sneak","Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:400; line-height:1.5; -webkit-font-smoothing:antialiased; font-feature-settings:"ss06" 1;}
  a{color:inherit;}
  .mono{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase;}

  /* ===== pixel controls (cell / brush size) ===== */
  .pxctl{position:fixed; left:16px; bottom:16px; z-index:200; display:none; align-items:center; gap:5px;
    padding:7px 9px; background:rgba(255,255,255,.82); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border:1px solid rgba(10,10,10,.12); border-radius:10px;
    font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;}
  .pxctl .lbl{color:var(--muted); margin:0 3px;}
  .pxctl .lbl:first-child{margin-left:0;}
  .pxctl button{font:inherit; width:22px; height:22px; display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(10,10,10,.16); background:#fff; color:var(--ink); border-radius:6px; cursor:pointer; padding:0; transition:background .15s,border-color .15s;}
  .pxctl button:hover{border-color:rgba(10,10,10,.45);}
  .pxctl button.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .pxctl{transition:opacity .35s ease, transform .35s ease;}
  .pxctl.hide{opacity:0; transform:translateY(8px); pointer-events:none;}

  /* ===== masthead: centered logo with text left & right ===== */
  .masthead{position:relative; z-index:4; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:24px; padding:12px var(--gutter); background:transparent;}
  .masthead p{margin:0; line-height:1.45; color:var(--ink); font-size:10px;}
  .masthead .mh-l{justify-self:start; text-align:left;}
  .masthead .mh-r{justify-self:end; text-align:right;}
  .masthead .mh-c{justify-self:center; display:flex;}
  .masthead .mh-c img{display:block; width:34px; height:auto;}
  @media(max-width:680px){
    .masthead{grid-template-columns:1fr auto; gap:14px 16px; row-gap:16px;}
    .masthead .mh-c{order:-1; grid-column:1 / -1; justify-self:center;}
    .masthead .mh-r{text-align:right;}
  }

  /* ===== hero ===== */
  #hero-kv{position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; pointer-events:none;}
  .hero{position:relative; min-height:100vh; background:transparent; z-index:1;}
  .hhead{position:relative; z-index:5; background:#fff; padding:0 var(--gutter);}
  .hhead::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:var(--line); transform-origin:left; transform:scaleX(0); animation:lineGrowX .9s cubic-bezier(.16,1,.3,1) .5s both;}
  .hhead .hgrid{max-width:var(--maxw); margin:0 auto; padding:calc(var(--cell)*2) 0 calc(var(--cell)*2 + 2px); display:grid; grid-template-columns:1fr; gap:calc(var(--cell)*3); align-items:stretch;}
  @media(min-width:900px){ .hhead .hgrid{grid-template-columns:1.6fr 1fr;} }
  .hhead .hl{margin:0; align-self:start; font-weight:400; text-transform:uppercase; font-size:clamp(32px,5.2vw,82px); line-height:0.92; letter-spacing:-0.035em;}
  @keyframes heroIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }
  @keyframes heroLine{ from{transform:translateY(115%);} to{transform:translateY(0);} }
  @keyframes lineGrowX{ to{transform:scaleX(1);} }
  @keyframes lineGrowY{ to{transform:scaleY(1);} }
  .hhead .ln{display:block; overflow:hidden; padding-bottom:.08em; margin-bottom:-.08em;}
  .hhead .ln > span{display:block; transform:translateY(115%); animation:heroLine .95s steps(6) both;}
  .hhead .hl .ln:nth-child(1) > span{ animation-delay:.10s; }
  .hhead .hl .ln:nth-child(2) > span{ animation-delay:.21s; }
  .hhead .hdesc .ln:nth-child(1) > span{ animation-delay:.36s; }
  .hhead .hdesc .ln:nth-child(2) > span{ animation-delay:.44s; }
  .hhead .htag{ animation:heroIn .9s steps(6) .58s both; }
  .hhead .hfoot img{ animation:heroIn .9s steps(6) .78s both; }   /* logo lands a small beat after the tagline */
  @media(prefers-reduced-motion: reduce){ .hhead .ln > span{ animation:none; transform:none; } .hhead .htag, .hhead .hfoot img{ animation:none; } .hhead::after{ animation:none; transform:scaleX(1); } .hcol::before{ animation:none; transform:scaleY(1); } }
  .hhead .hcol{position:relative; display:flex; flex-direction:column; justify-content:space-between; gap:calc(var(--cell)*2);}
  @media(min-width:900px){
    .hhead .hcol{padding-left:calc(var(--cell)*3);}
    .hhead .hcol::before{content:""; position:absolute; left:0; top:calc(var(--cell)*-2); bottom:calc(var(--cell)*-2); width:1px; background:var(--line); transform-origin:top; transform:scaleY(0); animation:lineGrowY .85s cubic-bezier(.16,1,.3,1) .42s both;}  /* divider spans the full bar height */
  }
  .hhead .hdesc{margin:0; font-weight:400; text-transform:uppercase; font-size:clamp(13px,1.45vw,20px); line-height:1.18; letter-spacing:-0.01em;}
  .hhead .hdesc span{display:block; text-align:justify; text-align-last:justify; -webkit-text-align-last:justify;}
  .hhead .hfoot{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; perspective:900px;}
  .hhead .hfoot img{width:34px; height:auto; display:block; flex:none; margin-top:2px;}
  /* W logo: a choppy 3D (rotateY) spin on hover and every ~10s */
  .wlogo{display:inline-block; flex:none; transform-origin:50% 50%;}
  @keyframes wSpin{ from{transform:rotateY(0);} to{transform:rotateY(360deg);} }
  .wlogo:hover, .wlogo.spin{ animation:wSpin .9s steps(18); }
  @media(prefers-reduced-motion: reduce){ .wlogo:hover, .wlogo.spin{ animation:none; } }
  .hhead .htag{margin:0; font-size:13px; line-height:1.45; max-width:34ch; text-align:right;}

  main{position:relative; z-index:2;}
  .sheet{position:relative; z-index:2; background:transparent;}
  .hero + .sheet{margin-top:clamp(calc(var(--cell)*18),55vh,calc(var(--cell)*38));}   /* breathing room after the hero, grid-stepped */
  /* keep the BCP tiles tied to the protocol intro above them */
  #protocol{padding-bottom:calc(var(--cell)*2.5);}
  #protocol-parts{padding-top:calc(var(--cell)*1);}

  /* ===== editorial ===== */
  section.ed{padding:calc(var(--cell)*9) var(--gutter);}
  .ed .wrap{max-width:var(--maxw); margin:0 auto; display:flex; flex-direction:column; gap:calc(var(--cell)*2);}
  @media(min-width:860px){ .ed .wrap{display:grid; grid-template-columns:0.82fr 1.18fr; column-gap:calc(var(--cell)*6); row-gap:0; align-items:start;} .ed .head{margin:0;} }
  .ed .kick{color:var(--muted); margin:14px 0 0; font-size:10px;}
  .ed h2{font-size:clamp(26px,3.4vw,46px); line-height:1.06; letter-spacing:-.02em; font-weight:400; margin:0; max-width:16ch;}
  .ed p{font-size:clamp(15px,1.15vw,18px); line-height:1.62; max-width:48ch; margin:0 0 1.05em; color:#2a2a2a; text-align:justify; text-align-last:left;}
  .ed p:last-child{margin-bottom:0;} .ed p.s{color:var(--muted); font-size:14px;} .ed strong{font-weight:500; color:var(--ink);}
  .two{display:grid; grid-template-columns:1fr; gap:calc(var(--cell)*2); max-width:none; margin:calc(var(--cell)*3.5) 0;}   /* more breathing room above + below the smileys */
  @media(min-width:560px){ .two{grid-template-columns:1fr 1fr;} }
  .two .c{text-align:center;} .two .c .l{color:var(--muted); margin-bottom:7px;} .two .c p{font-size:14px; margin:0; text-wrap:balance; text-align:center; text-align-last:center;}
  .two .c{position:relative;}
  .two .c .smiley{display:block; width:128px; height:128px; margin:2px auto 18px; transform-origin:50% 58%; will-change:transform; transition:transform .3s ease;}
  .two .c .smiley.sm-jump{animation:smJump .62s cubic-bezier(.3,1.5,.5,1);}
  .two .c .smiley.sm-shy{transform:scale(.93) translateY(3px);}   /* recoil a little when shy */
  @keyframes smJump{0%{transform:translateY(0)}28%{transform:translateY(-18px)}52%{transform:translateY(0)}68%{transform:translateY(-7px)}100%{transform:translateY(0)}}
  .sm-heart{position:absolute; z-index:6; pointer-events:none; animation:smHeart 1s ease-out forwards;}
  @keyframes smHeart{0%{opacity:0; transform:translate(-50%,0) scale(.5)}14%{opacity:1}100%{opacity:0; transform:translate(-50%,-72px) scale(1.1)}}
  .ed .wrap > .reveal:not(.head) > p{max-width:none;}   /* two-column sections: right-column text fills the column, same width as the .two smiley grid */
  #shift p.s, #ai p.s{font-size:clamp(15px,1.15vw,18px); color:#2a2a2a;}   /* match size + color of the body paragraph above */

  /* ===== pull quote ===== */
  .quote{padding:clamp(80px,14vh,180px) var(--gutter); background:var(--ink); color:var(--paper); border-radius:var(--radius); margin:0 8px;}
  .quote .wrap{max-width:var(--maxw); margin:0 auto;}
  .quote .q{font-size:clamp(32px,6vw,98px); line-height:1; letter-spacing:-.03em; font-weight:300; margin:0; max-width:15ch;}
  .quote .attr{margin-top:26px; color:rgba(255,255,255,.5);}
  .quote .after{margin-top:30px; font-size:clamp(15px,1.2vw,19px); line-height:1.6; max-width:40ch; color:rgba(255,255,255,.82);}

  /* ===== springy carousels ===== */
  .caro{position:relative; z-index:2; background:transparent; padding:calc(var(--cell)*7) var(--gutter);}
  .caro .ch{max-width:var(--maxw); margin:0 auto calc(var(--cell)*2); padding:0; display:flex; justify-content:space-between; align-items:baseline; gap:var(--cell);}
  .caro .ch h2{font-size:clamp(26px,3.4vw,46px); line-height:1.06; font-weight:400; letter-spacing:-.02em; margin:0;}
  .caro .ch .hint{color:var(--muted); white-space:nowrap;}
  .track-wrap{overflow:hidden; margin:0 calc(-1 * var(--gutter)); padding:calc(var(--cell)*3) 0; touch-action:pan-y; user-select:none; -webkit-user-select:none;}
  .track-wrap, .track-wrap *{cursor:grab;}
  .track-wrap.drag, .track-wrap.drag *{cursor:grabbing !important;}
  .track-wrap a{-webkit-user-drag:none;}
  .track-wrap{position:relative;}
  .sl-arrow{position:absolute; top:calc(var(--cell)*3 + 175px); transform:translateY(-50%); z-index:6; width:42px; height:42px; border:0; background:var(--ink); color:#fff; display:none; align-items:center; justify-content:center; padding:0; cursor:pointer; transition:background .2s ease, opacity .25s ease;
    clip-path:polygon(10px 0, calc(100% - 10px) 0, calc(100% - 10px) 5px, calc(100% - 5px) 5px, calc(100% - 5px) 10px, 100% 10px, 100% calc(100% - 10px), calc(100% - 5px) calc(100% - 10px), calc(100% - 5px) calc(100% - 5px), calc(100% - 10px) calc(100% - 5px), calc(100% - 10px) 100%, 10px 100%, 10px calc(100% - 5px), 5px calc(100% - 5px), 5px calc(100% - 10px), 0 calc(100% - 10px), 0 10px, 5px 10px, 5px 5px, 10px 5px, 10px 0);}   /* pixel-stepped corners to match the buttons */
  .sl-arrow.prev{left:16px;} .sl-arrow.next{right:16px;}
  .sl-arrow svg{width:18px; height:18px;}
  .sl-arrow:hover{background:#3b5bd9;}   /* same blue hover as the buttons */
  .sl-arrow[disabled]{opacity:0; pointer-events:none;}
  @media(hover:hover) and (pointer:fine){ .sl-arrow{display:flex;} }
  .track{display:flex; gap:28px; width:max-content; padding:0 max(var(--gutter), calc((100vw - var(--maxw)) / 2)); will-change:transform;}   /* aligned to the centred grid; gap leaves room for the hover frame */
  .slide{flex:0 0 auto; width:min(78vw,320px); display:flex; flex-direction:column; gap:13px; text-decoration:none; color:inherit;}
  .slide .pv{position:relative; border-radius:0; overflow:hidden; background:transparent;}
  .slide .pv canvas, .slide .pv video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; background:#0A0A0A; pointer-events:none;}
  .slide .cap{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:0 2px;}
  .slide .cap .ti{font-size:16px; font-weight:500; margin:0; letter-spacing:-.01em;} .slide .cap .ds{color:var(--muted);}
  /* case-study slides: media + centered copy */
  .slide.cs{width:min(90vw,420px); display:flex; flex-direction:column; align-items:center; text-align:center; gap:0; padding:0 0 26px; border-radius:0; overflow:visible; background:transparent;}
  .slide.cs .csm{position:relative; width:100%; height:350px; overflow:hidden; background:#0A0A0A;}   /* 25 cells tall, aligned to the pixel grid */
  .slide.cs .csm video, .slide.cs .csm img{width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; transform:scale(1.14);}
  /* placeholder media (drop a real clip in later) */
  .slide.cs .csm.ph{display:flex; align-items:center; justify-content:center; flex-direction:column; gap:9px; background:#ececec; color:#9a9a9a;}
  .slide.cs .csm.ph .pi{font-size:23px; line-height:1;}
  .slide.cs .csm.ph .pl{font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase;}
  .slide.cs .t{font-size:clamp(22px,2.2vw,30px); font-weight:500; letter-spacing:-.02em; margin:20px 0 0;}
  .slide.cs .d{color:#2a2a2a; font-size:14.5px; line-height:1.5; margin:9px 26px 0; max-width:32ch;}
  /* in-image hover tell: "view case study" reveal on the media, desktop only */
  .slide.cs .reveal-cta{display:none; position:absolute; inset:0; z-index:2;
    background:linear-gradient(to top, rgba(10,10,10,.8) 0, rgba(10,10,10,.8) 14px, rgba(10,10,10,.52) 14px, rgba(10,10,10,.52) 28px, rgba(10,10,10,.28) 28px, rgba(10,10,10,.28) 42px, rgba(10,10,10,.1) 42px, rgba(10,10,10,.1) 56px, rgba(10,10,10,0) 56px);   /* 4 stepped lines of black */
    transform:translateY(100%); pointer-events:none; transition:transform .5s steps(4);}   /* gradient slides up, no fade */
  .slide.cs:hover .reveal-cta{transform:translateY(0);}
  .slide.cs .rc-clip{display:none; position:absolute; left:0; right:0; bottom:16px; z-index:3; overflow:hidden; line-height:1.3; text-align:center; color:#fff; font-size:13px; font-weight:500; letter-spacing:-.01em; pointer-events:none;}
  .slide.cs .rc-i{display:inline-block; transform:translateY(130%); transition:transform .5s steps(5);}   /* label steps up in place, no fade */
  .slide.cs:hover .rc-i{transform:translateY(0);}
  @media(hover:hover) and (pointer:fine){
    .slide.cs .reveal-cta, .slide.cs .rc-clip{display:block;}  /* the tell only exists where there's a cursor to hover with */
    .track-wrap .slide.cs, .track-wrap .slide.cs *{cursor:pointer;}   /* tiles read as clickable, not just draggable */
  }
  /* featured case study (dark) */
  .feat{position:relative; z-index:2; margin:0 8px; background:var(--ink); color:var(--paper); border-radius:var(--radius); overflow:hidden;}
  .feat .wrap{max-width:var(--maxw); margin:0 auto; padding:clamp(26px,4vw,54px); display:grid; grid-template-columns:1fr; gap:clamp(22px,3vw,44px); align-items:center;}
  @media(min-width:880px){ .feat .wrap{grid-template-columns:1.05fr .95fr;} }
  .feat .media{border-radius:14px; overflow:hidden; aspect-ratio:16/10; background:#000;}
  .feat .media video{width:100%; height:100%; object-fit:cover; display:block;}
  .feat .k{color:rgba(255,255,255,.5); margin:0 0 14px;}
  .feat h2{font-size:clamp(30px,4.4vw,60px); line-height:1.02; letter-spacing:-.03em; font-weight:400; margin:0; max-width:15ch;}
  .feat p{color:rgba(255,255,255,.82); font-size:clamp(15px,1.2vw,18px); line-height:1.6; max-width:44ch; margin:20px 0 0;}
  .feat .split{display:flex; gap:28px; margin:26px 0 0;}
  .feat .split div{display:flex; flex-direction:column; gap:3px;}
  .feat .split b{font-size:clamp(22px,2.4vw,32px); font-weight:500;}
  .feat .split span{color:rgba(255,255,255,.5); font-size:10px;}
  .feat .flink{display:inline-block; margin:26px 0 0; color:#fff; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.5); padding-bottom:2px;}
  .feat .flink:hover{border-color:#fff;}
  /* explainer lists */
  .ed .pts{list-style:none; margin:calc(var(--cell)*2) 0 0; padding:0;}
  .ed .pts li{display:grid; grid-template-columns:auto 1fr; gap:var(--cell); align-items:baseline; padding:var(--cell) 0; border-top:1px solid var(--line); font-size:15px; line-height:1.5; color:#2a2a2a;}
  .ed .pts li .n{color:var(--muted); white-space:nowrap;}
  .ed .pts li b{font-weight:500; color:var(--ink);}
  .ed .pts li:last-child{border-bottom:1px solid var(--line);}   /* close the list under L5 */
  #ai p.s{margin-top:calc(var(--cell)*2);}   /* same gap below the list as above it */

  /* ===== cta + footer ===== */
  .cta{position:relative; z-index:2; background:transparent; padding:calc(var(--cell)*12) var(--gutter);}
  .cta .wrap{max-width:var(--maxw); margin:0 auto; text-align:center;}
  .cta h2{font-size:clamp(38px,8vw,130px); line-height:.95; letter-spacing:-.035em; font-weight:400; margin:0;}
  .cta .meta{margin:30px auto 0; font-size:clamp(15px,1.2vw,19px); line-height:1.6; max-width:46ch; color:var(--muted); text-wrap:balance;}
  .cta .meta.near{margin-top:16px;}
  .cta .meta a{color:var(--ink); text-decoration:none; background:repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 7px) left bottom/0% 3px no-repeat; transition:background-size .45s cubic-bezier(.16,1,.3,1); padding-bottom:2px;}
  .cta .meta a:hover{background-size:100% 3px;}
  .cta .meta .near{color:var(--ink);}
  .btn, .cta .ctabtn, .tt-again, .tt-teaser{position:relative; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; font-size:clamp(15px,1.2vw,18px); font-weight:500; letter-spacing:-.01em; padding:16px 36px; background:var(--ink); color:#fff; transition:background .2s;
    clip-path:polygon(10px 0, calc(100% - 10px) 0, calc(100% - 10px) 5px, calc(100% - 5px) 5px, calc(100% - 5px) 10px, 100% 10px, 100% calc(100% - 10px), calc(100% - 5px) calc(100% - 10px), calc(100% - 5px) calc(100% - 5px), calc(100% - 10px) calc(100% - 5px), calc(100% - 10px) 100%, 10px 100%, 10px calc(100% - 5px), 5px calc(100% - 5px), 5px calc(100% - 10px), 0 calc(100% - 10px), 0 10px, 5px 10px, 5px 5px, 10px 5px, 10px 0);}   /* pixel-stepped corners, no side nubs (like the slider arrows) */
  .cta .ctabtn{margin-top:38px;}
  .btn:hover, .cta .ctabtn:hover, .tt-again:hover, .tt-teaser:hover{background:#3b5bd9;}   /* colour change on hover (no position shift) */
  .btn .lbl, .cta .ctabtn .lbl, .tt-again .lbl, .tt-teaser .lbl{position:relative; z-index:2;}
  .btn .pxfx, .cta .ctabtn .pxfx, .tt-again .pxfx, .tt-teaser .pxfx{position:absolute; inset:0; z-index:1; display:grid; pointer-events:none;}
  footer{position:relative; z-index:2; height:calc(var(--cell)*9); background:transparent; overflow:hidden; cursor:pointer; transition:height .55s cubic-bezier(.16,1,.3,1);}   /* transparent so the cursor blob field shows behind the skyline */
  footer.playing{height:min(52vh,390px); cursor:default;}
  footer #footcity{position:absolute; left:0; bottom:0; width:100%; height:calc(var(--cell)*9); z-index:2; display:block; pointer-events:none;}   /* idle: skyline; on play it fills the footer and becomes the full-width board */
  footer.playing #footcity{top:0; bottom:auto; height:min(52vh,390px);}
  /* teaser: same styling as the site buttons, just centred in the footer strip */
  .tt-teaser{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:4; border:0; cursor:pointer; transition:opacity .35s, transform .35s, background .2s;}
  footer.playing .tt-teaser{opacity:0; pointer-events:none; transform:translate(-50%,-50%) scale(.86);}
  .tt-teaser .tt-blocks{display:inline-block; margin-left:9px; vertical-align:-3px;}
  .tt-teaser .tt-blocks canvas{display:block;}
  /* tetris HUD: drawn straight on the footer canvas, this is just the score + controls layer */
  #tetris{position:absolute; inset:0; z-index:3; display:none; pointer-events:none; font-family:var(--mono);}
  footer.playing #tetris{display:block;}

        if((r+0.5)*cell>hb.bottom && g>0.25 && dis[id]===0) dis[id]=0.45+hsh(c,r)*0.7; } } }
    sData=null;
    ctx.save(); if(shake>0.01){ shake*=0.9; ctx.translate((Math.random()-0.5)*shake*20,(Math.random()-0.5)*shake*20); } else shake=0;
    ctx.clearRect(-40,-40,W+80,H+80); ctx.fillStyle='#fff'; ctx.fillRect(-40,-40,W+80,H+80);
    /* grid + field are document-aligned, so they scroll with the page instead of being pinned to the viewport */
    var sy=TOUCH?0:scrollY, off=sy-Math.floor(sy/cell)*cell, s=cell-1;   /* on touch, lock the field to the viewport so iOS momentum scroll cannot make it jitter */
    ctx.strokeStyle='#fafafa'; ctx.lineWidth=1; ctx.beginPath();
    for(var gx=0;gx<=W;gx+=cell){ctx.moveTo(gx+.5,0);ctx.lineTo(gx+.5,H);}
    for(var gy=-off;gy<=H;gy+=cell){ctx.moveTo(0,gy+.5);ctx.lineTo(W,gy+.5);}
    ctx.stroke();
    var drStart=Math.floor(sy/cell)-1, drEnd=Math.floor((sy+H)/cell)+1;
    /* colour field is full below the header through the viewport, then fades out (ragged) by the next section */
    if(fhb<0) fhb=hb.bottom; else fhb += (hb.bottom-fhb)*(TOUCH?0.2:1);   /* ease the fade edge on touch so it glides instead of stepping */
    var hAmp=H*0.14, heroBottom=fhb+sy, heroEnd=heroBottom*0.55, fadeSpan=Math.max(1, heroBottom*0.18);   /* H (cached) not live innerHeight; span clamped positive so field is fully off past the hero */
    for(var dr=drStart; dr<=drEnd; dr++){
      var vy=dr*cell-sy, ccyView=vy+cell*0.5, vr=Math.floor(ccyView/cell), inRow=(vr>=0&&vr<rows);
      var dd=dr*cell, ny=(dr*cell)/H;
      for(var c2=0;c2<cols;c2++){ var ccx=(c2+.5)*cell, nx=(c2*cell)/innerWidth;
        /* ragged & random cutoff: smooth column waves + blocky random patches fade out earlier (below the viewport) */
        var co=Math.max(0,(Math.sin(c2*0.5+SEED)+Math.sin(c2*0.21-SEED*1.3))*0.16 + hsh(Math.floor(c2/2)+3.3,Math.floor(dr/4))*0.6 + 0.15), depthN=dd+co*hAmp;
        var regThr=depthN<=heroEnd?0:Math.min(1,(depthN-heroEnd)/fadeSpan);
        var safe=false; for(var si=0;si<safes.length;si++){ var sf=safes[si];
          if(ccx>=sf[0]&&ccx<=sf[2]&&ccyView>=sf[1]&&ccyView<=sf[3]){ safe=true; break; }              /* core */
          var fz=sf[4]; if(ccx>=sf[0]-fz&&ccx<=sf[2]+fz&&ccyView>=sf[1]-fz&&ccyView<=sf[3]+fz && hsh(c2+9.1,dr+4.7)<0.55){ safe=true; break; } }   /* ragged edge */
        if(safe) continue;                                   /* keep the masthead title clear */
        var v=inRow?heat[vr*cols+c2]*0.9:0;                  /* cursor heat / explosion paints anywhere */
        if(region(nx,ny,tt) > regThr && hsh(c2*1.7+11.3, dr*1.3+5.1) < intro){   /* ambient field: clustered in blobs, revealed by intro */
          v += base(nx,ny,tt)+(hsh(c2,dr)-0.5)*0.12+Math.sin((c2*0.6+dr*0.8)+tt*1.7)*0.045; }
        if(v<0.30 && !(v>=0.86&&v<1.02))continue; var col=BANDS[0][1]; if(v>=BANDS[1][0])col=BANDS[1][1]; if(v>=BANDS[2][0])col=BANDS[2][1]; if(v>=BANDS[3][0])col=BANDS[3][1]; if(v>=0.86&&v<1.02)col=(window.__wildNeon||'#d8ff00');
        ctx.fillStyle=col; ctx.fillRect(c2*cell, vy, s, s); } }
    ctx.restore();
  }
  function loop(ts){ if(!loop.l)loop.l=ts; var d=ts-loop.l; loop.l=ts; t+=d*SPEED; typeT+=d*SPEED/1000; introT+=d*SPEED/1000;
    render(); requestAnimationFrame(loop); }
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){ size(); });
  requestAnimationFrame(loop);


  /* Nearstudio parameter bridge. Defaults above stay byte-for-byte equivalent to the source. */
  function finite(v, fallback, lo, hi){ v=Number(v); return Number.isFinite(v)?Math.max(lo,Math.min(hi,v)):fallback; }
  function colour(v, fallback){ return typeof v==='string' && /^#[0-9a-f]{6}$/i.test(v)?v:fallback; }
  function applyNearstudioConfig(p){
    if(!p||typeof p!=='object')return;
    var nextCell=finite(p.cellSize,cell,5,28), needsSize=nextCell!==cell;
    cell=nextCell; BRUSH=finite(p.brushSize,BRUSH,4,24); SPEED=finite(p.motionSpeed,SPEED,0.1,2.5); TRAIL=finite(p.trail,TRAIL,0.72,0.98);
    BANDS[0][1]=colour(p.navy,BANDS[0][1]); BANDS[1][1]=colour(p.blue,BANDS[1][1]); BANDS[2][1]=colour(p.yellow,BANDS[2][1]); BANDS[3][1]=colour(p.red,BANDS[3][1]);
    window.__wildNeon=colour(p.neon,window.__wildNeon||'#d8ff00');
    if(needsSize)size();

  addEventListener('message',function(e){ if(e.origin!==location.origin||!e.data||e.data.type!=='nearstudio:wild-config')return; applyNearstudioConfig(e.data.parameters); });

  /* cell / brush size controls */
  var pxctl=document.getElementById('pxctl');
  if(pxctl){ pxctl.addEventListener('click', function(e){ var btn=e.target.closest('button'); if(!btn) return;
    function pick(attr){ pxctl.querySelectorAll('button[data-'+attr+']').forEach(function(x){ x.classList.remove('on'); }); btn.classList.add('on'); }
    if(btn.dataset.cell!=null){ cell=+btn.dataset.cell; size(); pick('cell'); }
    else if(btn.dataset.brush!=null){ BRUSH=+btn.dataset.brush; pick('brush'); }
  }); }
})();
/* intro lead: split into rendered lines and reveal them line by line */
(function(){
  var lead=document.querySelector('.intro .lead'); if(!lead) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ lead.classList.add('ready'); return; }
  var orig=lead.innerHTML, revealed=false;
  function split(){
    lead.innerHTML=orig;
    if(!lead.clientWidth) return false;                                    /* not laid out yet */
    var toks=[];
    [].forEach.call(lead.childNodes, function(n){
      var em = n.nodeType===1 && n.tagName==='EM';
      String(n.textContent).split(/(\s+)/).forEach(function(p){ if(p.length) toks.push({t:p, em:em, sp:/^\s+$/.test(p)}); });
    });
    lead.textContent='';
    var ws=toks.map(function(tk){ var s=document.createElement('span'); s.textContent=tk.t; if(tk.em) s.style.color='var(--muted)'; if(tk.sp) s.setAttribute('data-sp','1'); lead.appendChild(s); return s; });
    var lines=[], cur=null, top=null;
    ws.forEach(function(s){
      if(s.getAttribute('data-sp') && top===null) return;                  /* skip a leading space */
      var t=s.offsetTop;
      if(top===null || Math.abs(t-top)>2){ cur=[]; lines.push(cur); top=t; }
      cur.push(s);
    });
    lead.textContent='';
    lines.forEach(function(arr,i){
      var ln=document.createElement('span'); ln.className='ln';
      var inner=document.createElement('span'); inner.style.transitionDelay=(i*0.1)+'s';   /* each line a beat after the last */
      arr.forEach(function(s){ s.removeAttribute('data-sp'); inner.appendChild(s); });
      ln.appendChild(inner); lead.appendChild(ln);
    });
    lead.classList.add('ready');                                            /* lines are in place (translated out of view) - safe to show without flashing raw text */
    if(revealed) lead.classList.add('in');
    return true;
  }
  function init(){
    if(!split()){ requestAnimationFrame(init); return; }                   /* wait until it has a width */
    new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ revealed=true; lead.classList.add('in'); } }); },{threshold:0}).observe(lead);   /* reveal as soon as any part is visible */
    var rt; addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(function(){ lead.classList.remove('in'); split(); }, 200); });   /* re-flow lines on resize */
  }
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(init); else init();
})();
/* W logo: choppy 3D spin every ~10s (also spins on hover via CSS) */
(function(){ var l=document.querySelector('.wlogo'); if(!l) return;
  setInterval(function(){ l.classList.add('spin'); setTimeout(function(){ l.classList.remove('spin'); }, 860); }, 10000); })();
