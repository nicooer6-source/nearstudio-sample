<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f5" />
    <title>Aeterna Genesis Sand</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="hero" aria-label="Aeterna Genesis hero">
      <section class="intro">
        <h1 aria-label="The Genesis of Intelligence.">
          <span style="--word: 0">The</span>
          <span style="--word: 1">Genesis</span>
          <span style="--word: 2">of</span>
          <span style="--word: 3">Intelligence.</span>
        </h1>
        <p class="subtitle">
          <span style="--word: 0">Merging</span>
          <span style="--word: 1">the</span>
          <span style="--word: 2">precision</span>
          <span style="--word: 3">of</span>
          <span style="--word: 4">classical</span>
          <span style="--word: 5">mastery</span>
          <span style="--word: 6">with</span>
          <span style="--word: 7">the</span>
          <span style="--word: 8">frontier</span>
          <span style="--word: 9">of</span>
          <span style="--word: 10">artificial</span>
          <span style="--word: 11">intelligence.</span>
          <span style="--word: 12">We</span>
          <span style="--word: 13">build</span>
          <span style="--word: 14">what</span>
          <span style="--word: 15">stays.</span>
        </p>
        <div class="actions">
          <button type="button">Join Waitlist</button>
          <button type="button" class="secondary">View Vision</button>
        </div>
      </section>
      <section class="sand-stage" aria-label="Interactive pointillist hands">
        <div id="sand-root"></div>
      </section>
    </main>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
